<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Light/Dark Mode Toggle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Light/Dark Mode Toggle</h1>
  <button onclick="toggleMode()">Toggle Mode</button>

  <script>
    function toggleMode() {
      document.body.classList.toggle("dark-mode");
    }
  </script>

</body>
</html>
