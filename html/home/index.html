<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAHM Festival Ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ticket-container" id="ticket">
        <div class="ticket-left">
            <img src="naivasha.jpeg" alt="Naivasha">
        </div>

        <div class="ticket-right">
            <div class="header">
                <h2>FAHM FESTIVAL</h2>
                <p class="location">Nairobi, Kenya</p>
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <span>DATE & TIME</span>
                    <p>25 Apr, 2026 | 11:00am</p>
                </div>
                <div class="detail-item">
                    <span>TICKET TYPE</span>
                    <p>FAHM FESTIVAL - ADVANCE</p>
                </div>
                <div class="detail-item">
                    <span>ATTENDEE</span>
                    <p>Benjamin James</p>
                </div>
                <div class="detail-item">
                    <span>BOOKING ID</span>
                    <p>#69e1cc9d8d7e1</p>
                </div>
            </div>

            <div class="footer-info">
                <div class="payment-box">
                    <span>TOTAL PAID</span>
                    <p>KES 300</p>
                </div>
            
            <p class="mission-statement">
                Advocating for Mental Health Awareness through African Creativity.
            </p>
            
            <div class="qr_img">
                <img src="qrcode.png" alt="">
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
